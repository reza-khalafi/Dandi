<!-- Multi-Theme Dropdown Switcher -->
<div class="relative inline-block text-right">
  <button id="theme-menu-button" type="button" 
          class="flex items-center gap-2 px-3 py-2 rounded-xl border border-border-color bg-card-bg/70 hover:bg-card-bg hover:border-brand-purple/40 text-text-primary text-xs font-semibold shadow-sm transition duration-200">
    <!-- Palette Icon -->
    <svg class="w-4 h-4 text-brand-purple" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 21a4 4 0 01-4-4V5a2 2 0 012-2h4a2 2 0 012 2v12a4 4 0 01-4 4zm0 0h12a2 2 0 002-2v-4a2 2 0 00-2-2h-2.343M11 7.343l1.657-1.657a2 2 0 012.828 0l2.829 2.829a2 2 0 010 2.828l-8.486 8.485M7 17h.01"></path>
    </svg>
    <span class="hidden sm:inline">تغییر تم</span>
    <svg class="w-3 h-3 opacity-60" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
    </svg>
  </button>

  <!-- Dropdown Menu -->
  <div id="theme-dropdown-menu" 
       class="hidden absolute left-0 sm:right-auto sm:left-0 mt-2 w-56 rounded-2xl glass-panel shadow-2xl z-50 p-2 space-y-1 transform transition duration-200 origin-top-left">
    
    <!-- Light Theme -->
    <button data-set-theme="light" 
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium hover:bg-brand-purple/10 text-text-primary transition">
      <div class="flex items-center gap-2.5">
        <span class="w-3.5 h-3.5 rounded-full bg-white border border-slate-300 shadow-inner"></span>
        <span>سفید و مینیمال (روز)</span>
      </div>
      <span class="theme-active-indicator opacity-0 text-brand-purple font-bold">✓</span>
    </button>

    <!-- Dark Midnight -->
    <button data-set-theme="dark-midnight" 
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium hover:bg-brand-purple/10 text-text-primary transition">
      <div class="flex items-center gap-2.5">
        <span class="w-3.5 h-3.5 rounded-full bg-[#090d16] border border-blue-500/40 shadow-inner"></span>
        <span>شب لاجوردی (Midnight)</span>
      </div>
      <span class="theme-active-indicator opacity-0 text-brand-purple font-bold">✓</span>
    </button>

    <!-- Dark Velvet -->
    <button data-set-theme="dark-velvet" 
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium hover:bg-brand-purple/10 text-text-primary transition">
      <div class="flex items-center gap-2.5">
        <span class="w-3.5 h-3.5 rounded-full bg-[#140f29] border border-purple-500/50 shadow-inner"></span>
        <span>شب مخملی (Deep Velvet)</span>
      </div>
      <span class="theme-active-indicator opacity-0 text-brand-purple font-bold">✓</span>
    </button>

    <!-- Dark Cyber / Autumn -->
    <button data-set-theme="dark-cyber" 
            class="w-full flex items-center justify-between px-3 py-2 rounded-xl text-xs font-medium hover:bg-brand-purple/10 text-text-primary transition">
      <div class="flex items-center gap-2.5">
        <span class="w-3.5 h-3.5 rounded-full bg-[#191921] border border-orange-500/50 shadow-inner"></span>
        <span>غروب سایبر (Cyber Dusk)</span>
      </div>
      <span class="theme-active-indicator opacity-0 text-brand-purple font-bold">✓</span>
    </button>
  </div>
</div>
