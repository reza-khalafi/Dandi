<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%" fill="none">
  <defs>
    <!-- Primary Gradients for Dandi Emblem -->
    <linearGradient id="dandi-stem-grad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="60%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="dandi-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74" />
      <stop offset="50%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="dandi-violet-accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>

    <radialGradient id="dandi-center-core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FED7AA" />
      <stop offset="70%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </radialGradient>

    <filter id="subtle-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#8B5CF6" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Ambient Light Circle -->
  <circle cx="60" cy="60" r="54" fill="url(#dandi-glow-grad)" opacity="0.08" />

  <!-- Outer Dynamic 'D' Swirl / Flying Breeze Arc -->
  <path d="M 46 22 C 78 20, 102 38, 98 68 C 94 92, 70 102, 46 96" 
        stroke="url(#dandi-stem-grad)" stroke-width="4.5" stroke-linecap="round" fill="none" 
        stroke-dasharray="1 0" filter="url(#subtle-shadow)" />

  <!-- Dandelion Slender Stem -->
  <path d="M 52 98 C 50 82, 53 66, 56 56" 
        stroke="url(#dandi-stem-grad)" stroke-width="3.5" stroke-linecap="round" fill="none" />

  <!-- Central Flower Core -->
  <circle cx="56" cy="54" r="7.5" fill="url(#dandi-center-core)" filter="url(#subtle-shadow)" />
  <circle cx="56" cy="54" r="3.2" fill="#FFFFFF" />

  <!-- Radiating Seed Rays -->
  <!-- Upper Left Ray -->
  <path d="M 56 54 L 38 40" stroke="url(#dandi-glow-grad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="36" cy="38" r="3" fill="#FB923C" />
  
  <!-- Top Ray -->
  <path d="M 56 54 L 52 28" stroke="url(#dandi-glow-grad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="51" cy="26" r="3" fill="#FDBA74" />

  <!-- Upper Right Ray -->
  <path d="M 56 54 L 74 34" stroke="url(#dandi-violet-accent)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="76" cy="32" r="3" fill="#C084FC" />

  <!-- Right Ray -->
  <path d="M 56 54 L 80 52" stroke="url(#dandi-violet-accent)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="82" cy="52" r="2.8" fill="#A855F7" />

  <!-- Lower Left Ray -->
  <path d="M 56 54 L 36 66" stroke="url(#dandi-glow-grad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="34" cy="68" r="2.8" fill="#F97316" />

  <!-- Lower Mid Ray -->
  <path d="M 56 54 L 46 76" stroke="url(#dandi-glow-grad)" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="44" cy="78" r="2.6" fill="#FB923C" />

  <!-- Seeds Taking Flight (Dandi Seedlings in the Wind) -->
  <!-- Seed 1: Far Flight -->
  <g transform="translate(86, 20) rotate(28)">
    <ellipse cx="0" cy="0" rx="3.5" ry="1.6" fill="#FB923C" />
    <path d="M 0 0 C 4 -5, 10 -7, 14 -8" stroke="#C084FC" stroke-width="1.6" stroke-linecap="round" fill="none" />
    <path d="M 14 -8 L 11 -13 M 14 -8 L 17 -12 M 14 -8 L 18 -7" stroke="#DDD6FE" stroke-width="1.3" stroke-linecap="round" />
  </g>

  <!-- Seed 2: Mid Flight -->
  <g transform="translate(100, 42) rotate(40)">
    <ellipse cx="0" cy="0" rx="3" ry="1.4" fill="#C084FC" />
    <path d="M 0 0 C 3 -4, 8 -6, 11 -7" stroke="#FB923C" stroke-width="1.5" stroke-linecap="round" fill="none" />
    <path d="M 11 -7 L 9 -11 M 11 -7 L 14 -10 M 11 -7 L 15 -6" stroke="#FED7AA" stroke-width="1.2" stroke-linecap="round" />
  </g>

  <!-- Seed 3: Rising Breeze -->
  <g transform="translate(72, 10) rotate(16)">
    <circle cx="0" cy="0" r="1.8" fill="#FDBA74" />
    <path d="M 0 0 L 8 -5" stroke="#C084FC" stroke-width="1.2" stroke-linecap="round" fill="none" />
    <path d="M 8 -5 L 6 -8 M 8 -5 L 10 -7" stroke="#E9D5FF" stroke-width="1" stroke-linecap="round" />
  </g>
</svg>
